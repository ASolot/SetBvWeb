name: Deploy to cPanel
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Latest Changes in cPanel Repository
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.CPANEL_HOSTNAME }}/execute/VersionControl/update" \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_TOKEN }}" \
            -d "repository_root=${{ secrets.CPANEL_REPO_ROOT }}" \
            -d "branch=main")
          echo "$RESPONSE"

      - name: Execute cPanel Deployment (.cpanel.yml)
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.CPANEL_HOSTNAME }}/execute/VersionControlDeployment/create" \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_TOKEN }}" \
            -d "repository_root=${{ secrets.CPANEL_REPO_ROOT }}")
          echo "$RESPONSE"
